services:
  db:
    image: postgres:15-alpine
    container_name: dashboard_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: Dashboard_development
      POSTGRES_USER: DASHBOARD_DEV
      POSTGRES_PASSWORD: Dashboard.DEV123
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U DASHBOARD_DEV -d Dashboard_development" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

volumes:
  postgres_data_dev:
