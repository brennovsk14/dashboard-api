spring.application.name=dashboard.api
spring.datasource.url=jdbc:postgresql://localhost:5435/Dashboard_development
spring.datasource.username=DASHBOARD_DEV
spring.datasource.password=Dashboard.DEV123
server.port=8080
server.address=0.0.0.0

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# upload de planilhas (padrão do Spring é 1MB, pouco para .xlsx real)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# origens que podem chamar a API pelo navegador (dev server do Angular)
app.cors.origens=http://localhost:4200,http://127.0.0.1:4200

# limites do conteúdo da planilha, para um .xlsx pequeno não virar um JSON gigante
app.planilha.max-linhas=50000
app.planilha.max-colunas=200
